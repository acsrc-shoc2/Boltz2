name: Build Apptainer Container

on:
  push:
    paths:
      - 'boltz2.def'
      - '.github/workflows/build-container.yml'
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.4

      - name: Login to NVIDIA NGC registry
        run: echo "${{ secrets.NGC_API_KEY }}" | sudo apptainer registry login --username '$oauthtoken' --password-stdin docker://nvcr.io

      - name: Build container
        run: sudo apptainer build boltz2.sif boltz2.def

      - name: Upload built .sif as artifact
        uses: actions/upload-artifact@v4
        with:
          name: boltz2-sif
          path: boltz2.sif

      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | apptainer registry login --username ${{ github.actor }} --password-stdin oras://ghcr.io
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          apptainer push boltz2.sif oras://ghcr.io/${REPO_LOWER}/boltz2:latest
